name: Release Please
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # - name: Release Please
      #   uses: googleapis/release-please-action@c2a5a2bd6a758a0937f1ddb1e8950609867ed15c # v4
      #   with:
      #     token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      # Node LTS ships npm 11. The runner's default Node ships npm 10, whose `npx` can't fetch a git
      # dependency pinned to a full commit SHA ("GitFetcher requires an Arborist constructor").
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
      # Fork with `additional-paths` support (googleapis/release-please#2534). Pinned to a commit so that
      # a push to the branch can't change the code that runs with RELEASE_PLEASE_TOKEN.
      - name: Create Releases
        id: github-release
        run: |
          npx -y github:stan-stately/release-please#ac309f0b74f5302eee2acda68808446a4491a813 github-release \
            --token ${{ secrets.RELEASE_PLEASE_TOKEN }} \
            --repo-url ${{ github.repository }} \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json \
            --debug

      - name: Create Pull Requests
        id: release-pr
        run: |
          npx -y github:stan-stately/release-please#ac309f0b74f5302eee2acda68808446a4491a813 release-pr \
            --token ${{ secrets.RELEASE_PLEASE_TOKEN }} \
            --repo-url ${{ github.repository }} \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json \
            --debug
